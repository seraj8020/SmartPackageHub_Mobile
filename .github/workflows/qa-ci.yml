# QA CI for SmartPackageHub Mobile — runs on QA only (not Development).
# Feature work merges into Development; promote to QA to run CI + EAS publish.
# On QA push, triggers an Android APK build on Expo (https://expo.dev) via EAS.
name: QA Mobile

on:
  push:
    branches: [QA]
  pull_request:
    branches: [QA]
  workflow_dispatch:

concurrency:
  group: qa-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Safety: never run from Development even if workflow_dispatch selects it.
    if: >
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/QA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Publish Android QA APK to Expo Build (shows under the project on expo.dev).
      # Requires repo secret EXPO_TOKEN (Expo personal access token).
      - name: Setup Expo / EAS
        if: >
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/QA'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build (QA profile, Android APK)
        if: >
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/QA'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN secret. Create a token at https://expo.dev/settings/access-tokens then: gh secret set EXPO_TOKEN -R seraj8020/SmartPackageHub_Mobile"
            exit 1
          fi
          # --no-wait: hand off to Expo cloud so GitHub minutes are not spent waiting.
          # Build progress / APK download: https://expo.dev/accounts/byonverse/projects/SmartPackageHub_Mobile/builds
          eas build --platform android --profile qa --non-interactive --no-wait
